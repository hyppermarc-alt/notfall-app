  <style>
    :root { --bg: #fff; --text: #111114; --muted: #56565f; --line: #d6d6dd; --red: #d0021b; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e0e10; --text: #f3f3f5; --muted: #a7a7b1; --line: #34343c; --red: #e0182f; } }
    * { box-sizing: border-box; }
    html { -webkit-tap-highlight-color: transparent; background: var(--bg); }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text);
           font: 18px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
    .gate { width: 100%; max-width: 420px; }
    .gate-auto .gate { visibility: hidden; }
    .logo { width: 72px; height: 72px; border-radius: 18px; display: block; margin-bottom: 16px; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    p { margin: 0 0 20px; color: var(--muted); }
    label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 15px; color: var(--muted); }
    input { width: 100%; min-height: 54px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px;
            background: var(--bg); color: var(--text); font: inherit; font-size: 17px; }
    input:focus { outline: none; border-color: var(--red); }
    button { width: 100%; min-height: 56px; margin-top: 12px; border: 0; border-radius: 14px; background: var(--text); color: var(--bg);
             font: inherit; font-weight: 750; touch-action: manipulation; cursor: pointer; }
    button:disabled { opacity: .7; cursor: progress; }
    .err { margin: 12px 0 0; color: var(--red); font-weight: 650; }
    .call { display: flex; align-items: center; justify-content: center; min-height: 60px; margin-top: 28px; border-radius: 16px;
            background: var(--red); color: #fff; font-weight: 800; font-size: 20px; text-decoration: none; touch-action: manipulation; }
  </style>
</head>
